name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install pods
        run: pod install

      - name: Build (unsigned)
        run: |
          xcodebuild -workspace PenNote.xcworkspace -scheme PenNote \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PenNote.app Payload/
          zip -qry PenNote.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PenNote-ipa
          path: PenNote.ipa
