name: PenNote
options:
  bundleIdPrefix: com.jykim
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
targets:
  PenNote:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    scheme: {}
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PenNote
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 회의 내용을 노트에 녹음하기 위해 마이크를 사용합니다.
        NSCameraUsageDescription: 사진을 찍어 노트에 넣기 위해 카메라를 사용합니다.
        NSSpeechRecognitionUsageDescription: 말한 내용을 글자로 받아 적기 위해 음성 인식을 사용합니다.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jykim.pennote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
