name: PenNote
options:
  bundleIdPrefix: com.jykim
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  PenNote:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 펜노트
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jykim.pennote
        TARGETED_DEVICE_FAMILY: "1"
