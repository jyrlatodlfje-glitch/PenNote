name: PenNote
options:
  bundleIdPrefix: com.jykim
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
targets:
  PenNote:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Watch/**", "WatchWidget/**"]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - target: PenNoteWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    scheme: {}
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PenNote
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 회의 내용을 노트에 녹음하기 위해 마이크를 사용합니다.
        NSCameraUsageDescription: 사진을 찍어 노트에 넣기 위해 카메라를 사용합니다.
        NSSpeechRecognitionUsageDescription: 말한 내용을 글자로 받아 적기 위해 음성 인식을 사용합니다.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jykim.pennote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PenNoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [Sources/Watch, Sources/Shared]
    dependencies:
      - target: PenNoteWatchWidget
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: PenNote
        WKApplication: true
        # SideStore가 설치할 때 아이폰 앱 번들 ID 끝에 팀 번호를 붙이는데 이 값은 고쳐 주지 않는다(2026-10-24 설치 오류).
        WKCompanionAppBundleIdentifier: com.jykim.pennote.6JAM4983K9
        NSMicrophoneUsageDescription: 말한 내용을 노트에 받아 적기 위해 마이크를 사용합니다.
        WKBackgroundModes: [audio]
        UIBackgroundModes: [audio]
    settings:
      base:
        # 워치 번들 ID도 SideStore가 바꾼 아이폰 번들 ID로 시작해야 한다(2026-10-24 설치 오류).
        PRODUCT_BUNDLE_IDENTIFIER: com.jykim.pennote.6JAM4983K9.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: "YES"
  PenNoteWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [Sources/WatchWidget]
    info:
      path: Config/WatchWidget-Info.plist
      properties:
        CFBundleDisplayName: PenNote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jykim.pennote.6JAM4983K9.watchkitapp.widget
        SKIP_INSTALL: "YES"
