name: PenNote
options:
  bundleIdPrefix: com.jykim
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  PenNote:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 펜노트
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 회의 내용을 노트에 녹음하기 위해 마이크를 사용합니다.
        NSCameraUsageDescription: 사진을 찍어 노트에 넣기 위해 카메라를 사용합니다.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jykim.pennote
        TARGETED_DEVICE_FAMILY: "1"
